backend:
  name: github
  repo: JKonnra/konnra-official-site
  branch: main
  auth_type: implicit

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "products"
    label: "产品中心 (Products)"
    folder: "src/content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "产品型号 (Series / Part No)", name: "title", widget: "string" }
      - { label: "替代型号 (Cross Reference / Equivalent)", name: "equivalent", widget: "string", required: false }
      - { label: "间距规格 (Pitch)", name: "pitch", widget: "string", default: "4.20mm" }
      - { label: "产品分类 (Category)", name: "category", widget: "select", options: ["Wire-to-Board", "Board-to-Board", "Wire-to-Wire", "FFC/FPC Connectors", "Custom Harness"] }
      - { label: "主产品图片 (Main Image)", name: "heroImage", widget: "image" }
      - { label: "产品图册/多图展示 (Gallery Images)", name: "gallery", widget: "list", field: { label: "图片", name: "image", widget: "image" }, required: false }
      - { label: "PDF 规格书下载 (Datasheet PDF)", name: "datasheet", widget: "file", required: false }
      - { label: "核心电气与机械参数 (Specifications)", name: "specs", widget: "object", fields: [
          { label: "额定电流 (Current Rating)", name: "currentRating", widget: "string", default: "9A AC/DC" },
          { label: "额定电压 (Voltage Rating)", name: "voltageRating", widget: "string", default: "600V AC/DC" },
          { label: "接触电阻 (Contact Resistance)", name: "contactResistance", widget: "string", default: "10mΩ Max" },
          { label: "绝缘电阻 (Insulation Resistance)", name: "insulationResistance", widget: "string", default: "1000MΩ Min" },
          { label: "工作温度 (Operating Temp)", name: "tempRange", widget: "string", default: "-40°C to +105°C" },
          { label: "极数范围 (Poles / Circuits)", name: "circuits", widget: "string", default: "2-24 Circuits" }
        ]}
      - { label: "详细图文介绍与排版 (Detailed Description & Layout)", name: "body", widget: "markdown" }

  - name: "blog"
    label: "博客与新闻 (Blog & News)"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "文章标题 (Title)", name: "title", widget: "string" }
      - { label: "发布时间 (Publish Date)", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "摘要说明 (Description)", name: "description", widget: "text" }
      - { label: "文章分类 (Category)", name: "category", widget: "select", options: ["Industry News", "Technical Guide", "Product Updates", "Cross Reference"] }
      - { label: "封面图片 (Hero Image)", name: "heroImage", widget: "image", required: false }
      - { label: "作者 (Author)", name: "author", widget: "string", default: "Konnra Engineering Team" }
      - { label: "文章正文 (Body)", name: "body", widget: "markdown" }

  - name: "pages"
    label: "单页面配置 (Page Contents)"
    files:
      - label: "首页配置 (Home Page)", name: "home", file: "src/data/home.json", fields: [
          { label: "主标题", name: "heroTitle", widget: "string" },
          { label: "副标题/描述", name: "heroSubtitle", widget: "text" },
          { label: "主宣传图", name: "heroBanner", widget: "image" }
        ]
      - label: "关于我们 (About Us)", name: "about", file: "src/data/about.json", fields: [
          { label: "公司介绍标题", name: "title", widget: "string" },
          { label: "工厂面积数据", name: "area", widget: "string", default: "40,000㎡" },
          { label: "研发工程师人数", name: "engineers", widget: "string", default: "53+" },
          { label: "月产能数据", name: "capacity", widget: "string", default: "150M Sets" },
          { label: "详细图文介绍", name: "content", widget: "markdown" }
        ]
      - label: "联系方式配置 (Contact Info)", name: "contact", file: "src/data/contact.json", fields: [
          { label: "公司名称", name: "companyName", widget: "string" },
          { label: "官方邮箱", name: "email", widget: "string" },
          { label: "联系电话", name: "phone", widget: "string" },
          { label: "公司地址", name: "address", widget: "string" },
          { label: "WhatsApp号码", name: "whatsapp", widget: "string", required: false }
        ]
