<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Konnra Content Manager</title>
  <link rel="stylesheet" href="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.css" />
  <style>
    /* Custom Token Login Interface */
    #custom-auth-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(6px);
      z-index: 999999;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .auth-card {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      max-width: 460px;
      width: 90%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      text-align: left;
    }
    .auth-card h2 {
      margin: 0 0 10px;
      font-size: 20px;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .auth-card p {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
      margin: 0 0 18px;
    }
    .token-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 16px;
      outline: none;
      font-family: monospace;
    }
    .token-input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .auth-btn {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .auth-btn:hover {
      background: #0369a1;
    }
    .guide-link {
      display: block;
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #0284c7;
      text-decoration: none;
    }
    .guide-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="custom-auth-modal">
    <div class="auth-card">
      <h2>🔐 Konnra 内容管理后台登录</h2>
      <p>为了保障网站安全与内容管理权限，请粘贴您的 GitHub Personal Access Token：</p>
      <input type="password" id="gh-token-input" class="token-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />
      <button id="gh-token-submit" class="auth-btn">进入后台</button>
      <a href="https://github.com/settings/tokens/new" target="_blank" class="guide-link">👉 点击此处一键获取 GitHub Token (勾选 repo)</a>
    </div>
  </div>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    (function() {
      var modal = document.getElementById('custom-auth-modal');
      var input = document.getElementById('gh-token-input');
      var submit = document.getElementById('gh-token-submit');

      function checkToken() {
        var stored = localStorage.getItem('decap-cms-user');
        if (!stored) {
          modal.style.display = 'flex';
        }
      }

      submit.onclick = function() {
        var token = input.value.trim();
        if (!token) {
          alert('请输入有效的 GitHub Token');
          return;
        }
        var userData = {
          token: token,
          backendName: 'github'
        };
        localStorage.setItem('decap-cms-user', JSON.stringify(userData));
        modal.style.display = 'none';
        window.location.reload();
      };

      window.addEventListener('load', function() {
        setTimeout(checkToken, 500);
      });
    })();
  </script>
</body>
</html>
