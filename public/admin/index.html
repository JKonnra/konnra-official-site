<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Konnra Content Manager</title>
  <link rel="stylesheet" href="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.css" />
  <style>
    /* Styling for Token Input Modal if needed */
    .token-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .token-box {
      background: #ffffff;
      padding: 28px;
      border-radius: 12px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
    .token-box h3 { margin: 0 0 12px; font-size: 18px; color: #0f172a; }
    .token-box p { font-size: 13px; color: #64748b; line-height: 1.5; margin: 0 0 16px; }
    .token-box input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 16px;
    }
    .token-box .btn-row { display: flex; justify-content: flex-end; gap: 10px; }
    .token-box button {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-submit { background: #0284c7; color: #fff; border: none; }
    .btn-submit:hover { background: #0369a1; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
